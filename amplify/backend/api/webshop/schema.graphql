type Product
  @model(subscriptions: null)
  @auth(
    rules: [
      # allow admins to create, update and delete products
      { allow: groups, groups: ["Admin"] }
      # allow all authenticated users to view and create products
      { allow: private, operations: [create, read] }
      # allow all guest users (not authenticated) to view products
      { allow: public, operations: [read] }
    ]
  ) {
  id: ID!
  name: String!
  description: String
  image: String
  price: Float
  featured: Boolean
  orders: [ProductOrder] @hasMany(indexName: "byProduct", fields: ["id"])
}

type ProductOrder
  @model(queries: null, subscriptions: null)
  @auth(
    rules: [
      # allow admins to create ProductOrders for customers by using customer email in lambda
      { allow: owner, identityClaim: "email", ownerField: "customer" }
      { allow: groups, groups: ["Admin"] }
    ]
  ) {
  id: ID! @index(name: "byProduct", sortKeyFields: ["product_id", "order_id"])
  product_id: ID!
  order_id: ID! @index(name: "byOrder", sortKeyFields: ["product_id"])
  product: Product @belongsTo(fields: ["product_id"])
  order: Order @belongsTo(fields: ["order_id"])
}

type Order
  @model(subscriptions: null)
  @auth(
    rules: [
      # only owner can see his orders
      { allow: owner, identityClaim: "email", ownerField: "customer" }
      # allow admins to view orders
      { allow: groups, groups: ["Admin"] }
      { allow: private, operations: [create, read] }
    ]
  ) {
  id: ID! @index(name: "byUser", sortKeyFields: ["user"])
  user: String!
  date: String
  total: Float
  products: [ProductOrder] @hasMany(indexName: "byOrder", fields: ["id"])
}

enum OrderStatus {
  SUCCESS
  FAILED
}

input CartItem {
  id: ID!
  name: String
  image: String
  price: Float
  amount: Int
}

input ProcessOrderInput {
  id: ID!
  cart: [CartItem]
  total: Float!
  token: String!
  address: String
}

type Mutation {
  processOrder(input: ProcessOrderInput!): OrderStatus
    @function(name: "processPayment-${env}")
    @function(name: "createOrder-${env}")
}
